x-common: &common
  build: .
  env_file:
    - .env
  volumes:
    - spotify-mcp-data:/data
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  spotify-mcp:
    <<: *common
    restart: unless-stopped
    environment:
      MCP_LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "${MCP_PUBLISH_ADDR:-127.0.0.1}:${MCP_PUBLISH_PORT:-8765}:8080"

  spotify-mcp-auth:
    <<: *common
    profiles:
      - auth
    command: auth
    environment:
      SPOTIFY_CALLBACK_BIND: 0.0.0.0
      SPOTIFY_CALLBACK_PORT: 8888
    ports:
      - "127.0.0.1:${SPOTIFY_CALLBACK_PORT:-8888}:8888"

volumes:
  spotify-mcp-data:
